services:
  teacher-workbench:
    build: .
    image: teacher-workbench:latest
    container_name: teacher-workbench
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - teacher-data:/app/data
    environment:
      - DB_PATH=/app/data/data.sqlite
      - NODE_ENV=production
      # AI 配置(可选,也可在 App 内通过 /api/ai/config 设置)
      # - AI_API_KEY=your-key-here
      # - AI_BASE_URL=https://api.openai.com/v1
      # - AI_MODEL=gpt-4o-mini
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  teacher-data:
